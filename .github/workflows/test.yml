name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Script and page syntax
        run: |
          node --check swapper/web/app.js
          bash -n deploy/install.sh deploy/update.sh install-swapper.sh pull-docker.sh
          python -c "import json; json.load(open('swapper/catalog.json')); json.load(open('swapper/models.json'))"
