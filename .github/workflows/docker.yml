name: docker

on:
  push:
    branches: [main, master]
    paths:
      - "swapper/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: gnubyte/dgx-spark-swapper:latest
          outputs: type=docker,dest=/tmp/dgx-spark-swapper.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload container as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgx-spark-swapper
          path: /tmp/dgx-spark-swapper.tar
          if-no-files-found: error
          retention-days: 90
