name: release

# Publishes a GitHub release whenever swapper/VERSION changes on main: a
# spark-swapper-<version>.tar.gz (git archive of that commit) plus SHA256SUMS.
# Installed Swappers look for this every Sunday and install it unless an admin
# turned automatic updates off. Bump swapper/VERSION and add a CHANGELOG.md
# section for the version to ship one.
#
# Signing: boxes whose installed copy ships swapper/release-signers only install
# releases carrying a matching spark-swapper-<version>.tar.gz.sig. Sign with a
# key that never touches GitHub (deploy/sign-release.sh, run by a maintainer) —
# or, weaker but automatic, put the private key in the RELEASE_SIGNING_KEY secret
# and this workflow signs (that protects against tampered downloads, not against
# someone who can push to main).

on:
  push:
    branches: [main]
    paths:
      - "swapper/VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only ever from main, also when started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node --check swapper/web/app.js
          bash -n deploy/install.sh deploy/update.sh install-swapper.sh

      - name: Version
        id: v
        run: |
          ver=$(tr -d '[:space:]' < swapper/VERSION)
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "swapper/VERSION must be X.Y.Z, got '$ver'" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$ver is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.v.outputs.exists == 'false'
        run: |
          ver=${{ steps.v.outputs.version }}
          git archive --format=tar.gz --prefix="spark-swapper-$ver/" -o "spark-swapper-$ver.tar.gz" HEAD
          sha256sum "spark-swapper-$ver.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$ver" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md || true
          [[ -s notes.md ]] || echo "Spark Swapper $ver." > notes.md

      - name: Sign (when RELEASE_SIGNING_KEY is set)
        if: steps.v.outputs.exists == 'false'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          ver=${{ steps.v.outputs.version }}
          if [[ -n "$RELEASE_SIGNING_KEY" ]]; then
            umask 077
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key"
            ssh-keygen -Y sign -f "$RUNNER_TEMP/release-key" -n spark-swapper-release "spark-swapper-$ver.tar.gz"
            rm -f "$RUNNER_TEMP/release-key"
          fi

      - name: Publish
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${{ steps.v.outputs.version }}
          files=("spark-swapper-$ver.tar.gz" SHA256SUMS)
          [[ -f "spark-swapper-$ver.tar.gz.sig" ]] && files+=("spark-swapper-$ver.tar.gz.sig")
          gh release create "v$ver" "${files[@]}" \
            --title "Spark Swapper $ver" --notes-file notes.md --target "$GITHUB_SHA"
